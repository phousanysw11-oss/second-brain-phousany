<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Second Brain</title><link rel="stylesheet" href="/style.css"></head><body>
<aside><div class="brand">Second Brain<span>My Second Brain</span></div><nav aria-label="เมนูหลัก" id="nav"></nav><a class="brain" id="brainLink" target="_blank" rel="noopener">เปิด 3D Brain ↗</a><p class="side-note">พื้นที่ทำงานของฉัน<br>Personal Second Brain</p></aside>
<main><header><span id="identity">กำลังเปิดพื้นที่ทำงาน…</span><div class="tools"><button id="connect">เชื่อม Google</button><button id="backup">สำรองข้อมูล</button></div></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main>
<dialog id="editor"><form id="taskForm"><div class="dialog-head"><h2>รายละเอียดงาน</h2><button type="button" id="closeEditor" aria-label="ปิด">×</button></div><input type="hidden" name="id"><label>งานที่ต้องทำ<input name="title" required maxlength="240"></label><div class="form-grid"><label>ผู้รับผิดชอบ<input name="owner"></label><label>โครงการ<input name="project"></label><label>วันส่งที่ตกลงแล้ว<input name="due" type="date"></label><label>ลำดับวันนี้<select name="priority"><option value="normal">ตามแผน</option><option value="focus">งานสำคัญวันนี้</option></select></label></div><label>ขั้นตอนถัดไป<input name="next"></label><label>เกณฑ์เสร็จ<textarea name="doneWhen" rows="2"></textarea></label><label>หลักฐานผลงาน<textarea name="evidence" rows="2" placeholder="ชื่อไฟล์ ลิงก์ หรือสิ่งที่ผู้รับงานตรวจแล้ว"></textarea></label><div class="form-grid"><label>สถานะ<select name="status"><option value="todo">ยังไม่เริ่ม</option><option value="doing">กำลังทำ</option><option value="blocked">ติดขัด</option><option value="done">เสร็จแล้ว</option></select></label><label>ติดขัดเรื่องใด<input name="blocker"></label></div><p id="formError" class="error" role="alert"></p><button class="primary">บันทึกงาน</button></form></dialog>
<dialog id="reader"><button id="closeReader">ปิด</button><pre id="readText"></pre></dialog><script type="module" src="/app.js"></script></body></html>
